[workspace]
authors = ["Josh S Wilkinson <joshswilkinson@pm.me>"]
channels = ["conda-forge", "https://conda.modular.com/max"]
description = "csv parser in mojo"
name = "mojo_csv"
platforms = ["linux-64", "linux-aarch64", "osx-arm64"]
exclude-newer = "7d"
version = "1.7.0"

[tasks]
# tests
test = "mojo run -I dist tests/mojo_csv/test_threaded.mojo; mojo run -I dist tests/mojo_csv/test_methods.mojo; mojo run -I dist tests/mojo_csv/test_2d.mojo; mojo run -I dist tests/mojo_csv/test_parser_edge.mojo; mojo run -I dist tests/mojo_csv/test_in_memory.mojo"
test-dict = "mojo run -I dist tests/mojo_csv/test_dict_reader.mojo"
test-writer = "mojo run -I dist tests/mojo_csv/test_writer.mojo"
test-dev = "mojo run -I . test_parse.mojo"
#
# bench
bench = "mojo run -I dist tests/bench/bench.mojo"
bench-t = "mojo run -I dist tests/bench/bench_threaded_diff.mojo"
bench-dict = "mojo run -I dist tests/bench/bench_dict_reader.mojo"
bench-all = "mojo run -I dist tests/bench/bench.mojo;mojo run -I dist tests/bench/bench_dict_reader.mojo;mojo run -I dist tests/bench/bench_threaded_diff.mojo"
#
# dev
format = { cmd = "mojo format -l 88 ." }
prep = { depends-on = ["format", "test-dev"] }
example = "mojo run -I dist docs/example.mojo"
pack = "mojo precompile src -o .pixi/envs/default/lib/mojo/mojo_csv.mojoc;cp .pixi/envs/default/lib/mojo/mojo_csv.mojoc dist;sha256sum dist/mojo_csv.mojoc | awk -F ' ' '{print $1}' > dist/mojo_csv.mojoc.sha256sum;"
sync-recipe = "cp tests/recipe.yaml ../modular-community/recipes/mojo_csv/recipe.yaml && cp tests/test_pack.mojo ../modular-community/recipes/mojo_csv/test_pack.mojo"
test-build = { cmd = "rattler-build build --channel https://prefix.dev/modular-community --channel https://conda.modular.com/max --channel conda-forge --variant-config tests/variants.yaml --recipe tests/recipe.yaml" }
#
# python bindings
build-python-bindings = "mojo build python/mojo_csv_bind.mojo -I dist --emit shared-lib -o python/mojo_csv_bind.so"
test-python = { cmd = "python python/test_mojo_csv_bind.py", depends-on = ["build-python-bindings"] }
example-python = { cmd = "python python/example.py", depends-on = ["build-python-bindings"] }
bench-python = { cmd = "python python/bench_vs_python.py", depends-on = ["build-python-bindings"] }
# --skip-extisting=all

[dependencies]
mojo = ">=1.1.0,<1.1.9"
max = ">=26.3.0,<27"
#
